            <div id="start-button">☣️ Start</div>

    <!-- --- Part 1 Engine Script Core --- -->
    <script>
        (function() {
            const CONFIG = Object.freeze({ TICK_RATE: 1000 / 60 });
            
            // Central Game State Container
            let state = {
                mode: 'BOOT', // BOOT, LIVE, CRASH
                timeElapsed: 0
            };

            // Global Hooks for external micro-parts to read/write state
            window.getGameState = function() { return state; };
            window.setGameState = function(updaterFn) { state = updaterFn(state); };

            // Pure arrays to collect pipeline hooks from upcoming parts
            window.engineUpdateHooks = [];
            window.engineRenderHooks = [];
            window.engineDomHooks = [];

            let loopData = { lastTimestamp: 0, accumulatedTime: 0, currentFps: 60 };

            // Core Fixed-Timestep Logic Step
            function update(deltaTime) {
                if (state.mode !== 'LIVE') return;
                state.timeElapsed += deltaTime;

                // Fire all modular update hooks registered by upcoming parts
                window.engineUpdateHooks.forEach(function(hook) {
                    hook(deltaTime);
                });
            }

            // Core Visual Rendering Step
            function render(canvas, ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (state.mode === 'BOOT') {
                    ctx.fillStyle = 'rgba(12, 18, 28, 0.95)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#00ff55';
                    ctx.font = 'bold 26px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('>> CURSOR COMBAT <<', canvas.width / 2, canvas.height / 2 - 10);
                    ctx.fillStyle = '#00aaff';
                    ctx.font = '12px monospace';
                    ctx.fillText('[ CLICK WORKSPACE TO INITIALIZE SYSTEM ]', canvas.width / 2, canvas.height / 2 + 25);
                }

                if (state.mode === 'LIVE') {
                    // Fire all modular canvas rendering hooks registered by upcoming parts
                    window.engineRenderHooks.forEach(function(hook) {
                        hook(ctx, canvas.width, canvas.height);
                    });
                }
            }

            // Core DOM Refresh Step
            function syncDOM() {
                const minutes = Math.floor(state.timeElapsed / 60).toString().padStart(2, '0');
                const seconds = Math.floor(state.timeElapsed % 60).toString().padStart(2, '0');
                document.getElementById('fps-counter').textContent = `FPS: ${loopData.currentFps}`;
                document.getElementById('game-timer').textContent = `${minutes}:${seconds}`;

                // Fire all modular DOM text updates registered by upcoming parts
                window.engineDomHooks.forEach(function(hook) {
                    hook(state, loopData.currentFps);
                });
            }

            window.addEventListener('DOMContentLoaded', function() {
                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    ctx.imageSmoothingEnabled = false;
                }
                window.addEventListener('resize', resize);
                resize();

                function mainLoop(timestamp) {
                    if (!loopData.lastTimestamp) loopData.lastTimestamp = timestamp;
                    let delta = timestamp - loopData.lastTimestamp;
                    loopData.lastTimestamp = timestamp;
                    loopData.accumulatedTime += delta;
                    loopData.currentFps = Math.round(1000 / delta) || 60;

                    while (loopData.accumulatedTime >= CONFIG.TICK_RATE) {
                        update(CONFIG.TICK_RATE / 1000);
                        loopData.accumulatedTime -= CONFIG.TICK_RATE;
                    }

                    render(canvas, ctx);
                    syncDOM();
                    requestAnimationFrame(mainLoop);
                }

                window.addEventListener('mousedown', function() {
                    if (state.mode === 'BOOT') {
                        state.mode = 'LIVE';
                    }
                });

                requestAnimationFrame(mainLoop);
            });
        })();
    </script>

<script>

                }
            }
        });

})();
</script>
<!-- --- Part 3: Retro OS Vector Grid Background Module --- -->
<script>
(function() {
    const GRID_SIZE = 60; // Spacing interval for drawing background vector grid blocks

    // Register a rendering callback hook with our central global event bus
    if (window.engineRenderHooks) {
        window.engineRenderHooks.push(function(ctx, width, height) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)'; // Subtle desktop line visibility
            ctx.lineWidth = 1;

            // Draw clean vertical systemic grid partitions
            for (let x = 0; x < width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // Draw clean horizontal systemic grid partitions
            for (let y = 0; y < height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        });
    }
})();
</script>
<!-- --- Part 4: Mouse Vector Tracking Subsystem Module --- -->
<script>
(function() {
    // Inject custom mouse data coordinates securely into the main state register
    if (window.setGameState) {
        window.setGameState(function(currentState) {
            return {
                ...currentState,
                mouse: { x: 0, y: 0, lastX: 0, lastY: 0, speed: 0, isDown: false }
            };
        });
    }

    // Capture precise window pointer placement data
    window.addEventListener('mousemove', function(event) {
        if (window.setGameState) {
            window.setGameState(function(state) {
                if (!state.mouse) return state;
                return {
                    ...state,
                    mouse: {
                        ...state.mouse,
                        x: event.clientX,
                        y: event.clientY
                    }
                };
            });
        }
    });

    // Capture standard system press indicators
    window.addEventListener('mousedown', function() {
        if (window.setGameState) {
            window.setGameState(function(state) {
                if (!state.mouse) return state;
                return {
                    ...state,
                    mouse: { ...state.mouse, isDown: true }
                };
            });
        }
    });

    // Capture normal system liftoff indicators
    window.addEventListener('mouseup', function() {
        if (window.setGameState) {
            window.setGameState(function(state) {
                if (!state.mouse) return state;
                return {
                    ...state,
                    mouse: { ...state.mouse, isDown: false }
                };
            });
        }
    });

    // Hook calculations straight into the central continuous frame updater bus
    if (window.engineUpdateHooks) {
        window.engineUpdateHooks.push(function(deltaTime) {
            if (window.setGameState) {
                window.setGameState(function(state) {
                    if (!state.mouse) return state;

                    // Compute absolute pixel movement distance since previous clock frame
                    var deltaX = state.mouse.x - state.mouse.lastX;
                    var deltaY = state.mouse.y - state.mouse.lastY;
                    var calculatedVelocity = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                    return {
                        ...state,
                        mouse: {
                            ...state.mouse,
                            lastX: state.mouse.x,
                            lastY: state.mouse.lastY = state.mouse.y,
                            speed: calculatedVelocity
                        }
                    };
                });
            }
        });
    }
})();
</script>
<!-- --- Part 5: Reactive Laser Targeting Reticle Module --- -->
<script>
(function() {
    // Register our drawing instructions to the main visual frame bus
    if (window.engineRenderHooks) {
        window.engineRenderHooks.push(function(ctx, width, height) {
            // Fetch live cursor coordinates from our global state
            var state = window.getGameState();
            if (!state || !state.mouse) return;

            var mouse = state.mouse;
            // Base ring grows when swiping quickly, tightly locks when clicked down
            var baseRadius = mouse.isDown ? 10 : 15 + Math.min(mouse.speed * 0.12, 16);
            
            ctx.lineWidth = mouse.isDown ? 3 : 1.5;
            ctx.strokeStyle = mouse.isDown ? '#ff0055' : '#00ff55'; // Vibrant pink on click, neon green default

            // 1. Draw Outer Targeting Ring
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, baseRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 2. Draw Core Locking Center Dot
            ctx.fillStyle = mouse.isDown ? '#ffffff' : '#00ff55';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
            ctx.fill();

            // 3. Draw Four Precision Vector Ticks
            ctx.beginPath();
            // Left Tick
            ctx.moveTo(mouse.x - baseRadius - 5, mouse.y); ctx.lineTo(mouse.x - baseRadius, mouse.y);
            // Right Tick
            ctx.moveTo(mouse.x + baseRadius, mouse.y); ctx.lineTo(mouse.x + baseRadius + 5, mouse.y);
            // Top Tick
            ctx.moveTo(mouse.x, mouse.y - baseRadius - 5); ctx.lineTo(mouse.x, mouse.y - baseRadius);
            // Bottom Tick
            ctx.moveTo(mouse.x, mouse.y + baseRadius); ctx.lineTo(mouse.x, mouse.y + baseRadius + 5);
            ctx.stroke();

            // 4. Draw Full Screen Perimeter Scanlines (only when cursor is idle and unclicked)
            if (!mouse.isDown && mouse.speed < 1) {
                ctx.strokeStyle = 'rgba(0, 255, 85, 0.12)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                // Horizontal tracking ray
                ctx.moveTo(0, mouse.y); ctx.lineTo(width, mouse.y);
                // Vertical tracking ray
                ctx.moveTo(mouse.x, 0); ctx.lineTo(mouse.x, height);
                ctx.stroke();
            }
        });
    }
})();
</script>
<!-- --- Part 6: Pointer Ghost Trail & Motion Blur Dust Module --- -->
<script>
(function() {
    var MAX_ECHOES = 8;        // Number of retro cursor shadow duplicates
    var MAX_SPARKS = 40;       // Safety ceiling for floating digital fragments

    // Inject dedicated trail storage arrays safely into our system state
    if (window.setGameState) {
        window.setGameState(function(currentState) {
            return {
                ...currentState,
                cursorEchoes: [],
                motionSparks: []
            };
        });
    }

    // Hook tracking calculations directly into the continuous logic clock loop
    if (window.engineUpdateHooks) {
        window.engineUpdateHooks.push(function(deltaTime) {
            if (window.setGameState) {
                window.setGameState(function(state) {
                    if (!state.mouse || !state.cursorEchoes || !state.motionSparks) return state;

                    // 1. Maintain Historical Array Log for Cursor Trail Copies
                    var nextEchoes = state.cursorEchoes.slice();
                    nextEchoes.push({ x: state.mouse.x, y: state.mouse.y });
                    if (nextEchoes.length > MAX_ECHOES) {
                        nextEchoes.shift();
                    }

                    // 2. Physics Step: Move existing sparks, fade opacity down over time
                    var nextSparks = state.motionSparks.map(function(s) {
                        return {
                            ...s,
                            x: s.x + s.vx * deltaTime,
                            y: s.y + s.vy * deltaTime,
                            alpha: s.alpha - s.decay * deltaTime
                        };
                    }).filter(function(s) {
                        return s.alpha > 0; // Destroy dead particles
                    });

                    // 3. Dynamic Generator: Spawn dust trail chunks if pointer sweeps fast
                    if (state.mouse.speed > 8 && nextSparks.length < MAX_SPARKS) {
                        nextSparks.push({
                            x: state.mouse.x,
                            y: state.mouse.y,
                            vx: (Math.random() - 0.5) * 60,
                            vy: (Math.random() - 0.5) * 60,
                            size: Math.random() * 2.5 + 1,
                            alpha: 1.0,
                            decay: Math.random() * 1.5 + 1.0,
                            color: state.mouse.isDown ? '#ff0055' : '#00ff55'
                        });
                    }

                    return {
                        ...state,
                        cursorEchoes: nextEchoes,
                        motionSparks: nextSparks
                    };
                });
            }
        });
    }

    // Hook the trail painter rules directly into the central rendering loop
    if (window.engineRenderHooks) {
        window.engineRenderHooks.push(function(ctx, width, height) {
            var state = window.getGameState();
            if (!state) return;

            // Render old-school classic OS tracking pointer ghost trails
            if (state.cursorEchoes) {
                state.cursorEchoes.forEach(function(pos, index) {
                    // Gradual fade out based on historical age index
                    var opacity = (index + 1) / (state.cursorEchoes.length + 1) * 0.22;
                    ctx.fillStyle = state.mouse && state.mouse.isDown ? 'rgba(255, 0, 85, ' + opacity + ')' : 'rgba(0, 255, 85, ' + opacity + ')';
                    
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + 9, pos.y + 9);
                    ctx.lineTo(pos.x + 3, pos.y + 10);
                    ctx.closePath();
                    ctx.fill();
                });
            }

            // Render active digital dust motion debris particles
            if (state.motionSparks) {
                state.motionSparks.forEach(function(spark) {
                    ctx.fillStyle = spark.color;
                    ctx.globalAlpha = spark.alpha;
                    ctx.fillRect(spark.x, spark.y, spark.size, spark.size);
                });
                ctx.globalAlpha = 1.0; // Restore shared global alpha baseline
            }
        });
    }
})();
</script>
<!-- --- Part 7: Ammunition Subsystem & Laser Fire Vector Module --- -->
<script>
(function() {
    var LASER_SPEED = 950; // Velocity constant for traveling laser pulses (pixels per second)

    // Inject our active projectile database safely into the system state context
    if (window.setGameState) {
        window.setGameState(function(currentState) {
            return {
                ...currentState,
                lasers: []
            };
        });
    }

    // Intercept mouse clicks to compute cardinal vector angles and discharge ammo
    window.addEventListener('mousedown', function(event) {
        var state = window.getGameState();
        if (!state || state.mode !== 'LIVE') return;

        // Generate a 4-direction structural blast matrix (0, 90, 180, 270 degrees)
        var angles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
        var freshLasers = angles.map(function(angle) {
            return {
                x: event.clientX,
                y: event.clientY,
                vx: Math.cos(angle) * LASER_SPEED,
                vy: Math.sin(angle) * LASER_SPEED
            };
        });

        // Push a burst spark flash into our existing Part 6 particle pool if available
        var clickExplosion = Array.from({ length: 8 }).map(function() {
            return {
                x: event.clientX,
                y: event.clientY,
                vx: (Math.random() - 0.5) * 240,
                vy: (Math.random() - 0.5) * 240,
                size: Math.random() * 3 + 2,
                alpha: 1.0,
                decay: Math.random() * 2.0 + 2.0,
                color: '#00ffff' // High-energy cyan discharge spark
            };
        });

        if (window.setGameState) {
            window.setGameState(function(currentState) {
                var currentLasers = currentState.lasers || [];
                var currentSparks = currentState.motionSparks || [];
                return {
                    ...currentState,
                    lasers: currentLasers.concat(freshLasers),
                    motionSparks: currentSparks.concat(clickExplosion)
                };
            });
        }
    });

    // Hook projectile translation tracking into the constant logic frame clock loop
    if (window.engineUpdateHooks) {
        window.engineUpdateHooks.push(function(deltaTime) {
            if (window.setGameState) {
                window.setGameState(function(state) {
                    if (!state.lasers) return state;

                    // Advance laser coordinate positions using current velocity vectors
                    var filteredLasers = state.lasers.map(function(p) {
                        return {
                            ...p,
                            x: p.x + p.vx * deltaTime,
                            y: p.y + p.vy * deltaTime
                        };
                    }).filter(function(p) {
                        // Purge lasers that travel outside our active screen boundary pixels
                        return p.x >= 0 && p.x <= window.innerWidth && p.y >= 0 && p.y <= window.innerHeight;
                    });

                    return {
                        ...state,
                        lasers: filteredLasers
                    };
                });
            }
        });
    }

    // Hook laser vector painters into the central graphic render loop pipeline
    if (window.engineRenderHooks) {
        window.engineRenderHooks.push(function(ctx, width, height) {
            var state = window.getGameState();
            if (!state || !state.lasers) return;

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#00ffff'; // Neon cyan ray line
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffff'; // Glistening high-tech bloom filter

            state.lasers.forEach(function(laser) {
                ctx.beginPath();
                // Draw trailing laser paths using scaled historical directional velocity
                ctx.moveTo(laser.x - laser.vx * 0.015, laser.y - laser.vy * 0.015);
                ctx.lineTo(laser.x, laser.y);
                ctx.stroke();
            });

            // Always turn off bloom filter states immediately to safeguard browser engine frames
            ctx.shadowBlur = 0;
        });
    }
})();
</script>
<!-- --- Part 8: Pop-up Window Entity Spawner Subsystem Module --- -->
<script>
(function() {
    var WINDOW_SPAWN_RATE = 2.5; // Spawn a new pop-up error every 2.5 seconds
    var ERROR_TITLES = [
        "Warning: Spyware Detected",
        "Fatal Alert: 0x80070002",
        "Registry Error!",
        "Update Required Immediately",
        "Click to Win Free Prize!",
        "System Threat Warning"
    ];

    // Initialize our core popup object repository safely inside system memory
    if (window.setGameState) {
        window.setGameState(function(currentState) {
            return {
                ...currentState,
                popups: [],
                spawnTimer: 0
            };
        });
    }

    // Hook pop-up tracking mathematics straight into the system logic update loop
    if (window.engineUpdateHooks) {
        window.engineUpdateHooks.push(function(deltaTime) {
            if (window.setGameState) {
                window.setGameState(function(state) {
                    if (state.mode !== 'LIVE' || typeof state.popups === 'undefined') return state;

                    var updatedPopups = state.popups.slice();
                    var nextSpawnTimer = state.spawnTimer + deltaTime;

                    // Time-delta condition listener to generate structured pop-up objects
                    if (nextSpawnTimer >= WINDOW_SPAWN_RATE) {
                        nextSpawnTimer = 0; // Reset spawn interval clock ticker

                        // Determine randomized dimensional scales mimicking standard desktop dialogs
                        var popWidth = Math.floor(Math.random() * 80) + 160;
                        var popHeight = Math.floor(Math.random() * 60) + 110;
                        
                        // Pick random coordinate vectors while keeping boundaries cleanly inside screen pixels
                        var randomX = Math.random() * (window.innerWidth - popWidth);
                        var randomY = Math.random() * (window.innerHeight - popHeight - 40);
                        
                        // Select a random nostalgic clickbait error string
                        var randomTitle = ERROR_TITLES[Math.floor(Math.random() * ERROR_TITLES.length)];

                        // Push structural object blueprint configuration parameters
                        updatedPopups.push({
                            id: Date.now() + Math.random(),
                            x: randomX,
                            y: randomY,
                            w: popWidth,
                            h: popHeight,
                            title: randomTitle,
                            speed: Math.random() * 30 + 15, // Drift velocity constant
                            angle: Math.random() * Math.PI * 2 // Drift heading vector direction
                        });
                    }

                    // Physics Step: Apply basic drifting vector translation to all active pop-ups
                    updatedPopups = updatedPopups.map(function(popup) {
                        var nextX = popup.x + Math.cos(popup.angle) * popup.speed * deltaTime;
                        var nextY = popup.y + Math.sin(popup.angle) * popup.speed * deltaTime;

                        // Desktop border collision bouncing mechanics
                        var nextAngle = popup.angle;
                        if (nextX < 0 || nextX + popup.w > window.innerWidth) {
                            nextAngle = Math.PI - nextAngle;
                        }
                        if (nextY < 0 || nextY + popup.h > window.innerHeight - 40) {
                            nextAngle = -nextAngle;
                        }

                        return {
                            ...popup,
                            x: Math.max(0, Math.min(window.innerWidth - popup.w, nextX)),
                            y: Math.max(0, Math.min(window.innerHeight - popup.h - 40, nextY)),
                            angle: nextAngle
                        };
                    });

                    return {
                        ...state,
                        popups: updatedPopups,
                        spawnTimer: nextSpawnTimer
                    };
                });
            }
        });
    }
})();
</script>
<!-- --- Part 9: Nostalgic Pop-up UI Graphic Rendering Module --- -->
<script>
(function() {
    // Hook our classic canvas layout rendering routines onto the global graphics frame bus
    if (window.engineRenderHooks) {
        window.engineRenderHooks.push(function(ctx, width, height) {
            var state = window.getGameState();
            if (!state || !state.popups) return;

            // Iterate through every active pop-up entry currently tracked inside system storage
            state.popups.forEach(function(win) {

<script>
(function() {
    var audioCtx = null;

    // Safe lazy-initialization context wrapper to pass strict modern browser security blocks
    function confirmAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // Pure Synthesizer Pipeline: Generate Low-Fidelity Square Wave Laser Shots
    function playRetroLaserSound() {
        var ctx = confirmAudioContext();
        if (!ctx) return;

        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        osc.type = "square"; // Retro 8-bit classic gaming audio signature
        osc.frequency.setValueAtTime(880, ctx.currentTime); // High starting frequency pitch
        // Rapid pitch sweep downwards to create laser discharge physics sound
        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.08, ctx.currentTime); // Maintain comfortable master volume output
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.15);
    }

    // Pure Synthesizer Pipeline: Generate Textured Noise Explosions on Popup Destruction
    function playRetroExplosionSound() {
        var ctx = confirmAudioContext();
        if (!ctx) return;

        var bufferSize = ctx.sampleRate * 0.25; // 1/4 second explosion time interval
        var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buffer.getChannelData(0);

        // Populate sound wave memory sectors with white random audio data noise
        for (var i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        var noiseNode = ctx.createBufferSource();
        noiseNode.buffer = buffer;

        // Apply a custom low-pass audio filter to mimic deep physical window crunches
        var filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(600, ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, ctx.currentTime + 0.25);

        var gain = ctx.createGain();
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.25);

        noiseNode.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noiseNode.start();
        noiseNode.stop(ctx.currentTime + 0.25);
    }

    // Intercept active pointer fires to inject synthesizer laser feedback calls
    window.addEventListener('mousedown', function() {
        var state = window.getGameState ? window.getGameState() : null;
        if (!state) return;

        if (state.mode === 'LIVE') {
            playRetroLaserSound();
        }
    });

    // Run an isolated background status checker loop to flag state changes for explosions
    var historicalPopupCount = 0;
    function checkAudioTriggerPipeline() {
        var state = window.getGameState ? window.getGameState() : null;
        if (state && state.mode === 'LIVE' && state.popups) {
            // If popups decreases, a laser hit occurred inside Part 10 loops
            if (state.popups.length < historicalPopupCount) {
                playRetroExplosionSound();
            }
            historicalPopupCount = state.popups.length;
        }
        requestAnimationFrame(checkAudioTriggerPipeline);
    }
    requestAnimationFrame(checkAudioTriggerPipeline);
})();
</script>
